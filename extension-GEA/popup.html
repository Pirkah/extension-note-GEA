<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 180px; font-family: sans-serif; text-align: center; padding: 10px; margin: 0; }
        h3 { margin-top: 0; color: #2c3e50; font-size: 16px; }
        button { background: #3498db; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <h3>Calculateur GEA</h3>
    <button id="refresh">Recalculer</button>
    <script>
        document.getElementById('refresh').addEventListener('click', () => {
            chrome.tabs.query({active: true, currentWindow: true}, (tabs) => {
                chrome.tabs.reload(tabs[0].id);
            });
        });
    </script>
</body>
</html>
