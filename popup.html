<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-size: 12px;
      text-align: center;
    }
    h3 { margin: 0 0 6px; font-size: 14px; color: #38bdf8; }
    p { margin: 0 0 12px; color: #94a3b8; line-height: 1.4; }
    .socials {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid #1e293b;
    }
    .socials a {
      color: #cbd5e1;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .socials a:hover {
      color: #38bdf8;
      border-color: #38bdf8;
    }
  </style>
</head>
<body>
  <h3>🎓 Simulateur GEA v2.0</h3>
  <p>Le simulateur est intégré directement en haut de votre bulletin sur <strong>signatures.unilim.fr</strong>.</p>
  <div class="socials">
    <a href="https://twitter.com/pirkaah" target="_blank" title="Twitter / X">𝕏 Twitter</a>
    <a href="https://github.com/Pirkah" target="_blank" title="GitHub">GitHub</a>
    <a href="https://www.linkedin.com/in/juliennicolle/" target="_blank" title="LinkedIn">LinkedIn</a>
  </div>
</body>
</html>
